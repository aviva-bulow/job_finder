name: Weekly Company Discovery

on:
  schedule:
    - cron: "0 12 * * 1" # 12:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh company seed list
        run: python -m src.seed_refresh

      - name: Discover new company boards
        run: python -m src.discovery

      - name: Commit updated company lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/companies_seed.yaml config/companies.yaml
          git diff --cached --quiet || git commit -m "Weekly company discovery update"
          git push
