# A posting must mention at least one of these (title or description) to be
# considered. They mark the employer's work as mission-driven / pro-social.
# Avoid words that show up in nearly every posting's benefits or requirements
# boilerplate - e.g. "health", "medical", "mental health", "wellness"
# (benefits), "education" (requirements), "disability", "accessibility" (EEO
# statements) - or every posting will pass.
mission_keywords:
  # Climate / environment
  - climate
  - renewable
  - clean energy
  - clean tech
  - cleantech
  - climate tech
  - climatetech
  - decarbonization
  - decarbonize
  - carbon
  - emissions
  - net zero
  - net-zero
  - sustainability
  - sustainable
  - solar
  - wind energy
  - offshore wind
  - geothermal
  - hydrogen
  - biofuel
  - circular economy
  - esg
  - greenhouse gas
  - carbon capture
  - carbon removal
  - carbon credit
  - soil carbon
  - regenerative agriculture
  - conservation
  - biodiversity

  # Health / life sciences
  - healthcare
  - patients
  - patient care
  - clinical
  - clinicians
  - public health
  - global health
  - digital health
  - health equity
  - healthtech
  - biotech
  - life sciences
  - therapeutics
  - drug discovery
  - diagnostics
  - genomics
  - precision medicine

  # Education
  - edtech
  - students
  - learners
  - teachers
  - k-12
  - literacy

  # Economic opportunity / social services
  - financial inclusion
  - economic mobility
  - affordable housing
  - homelessness
  - underserved
  - low-income
  - poverty
  - workforce development
  - food security
  - food insecurity

  # Civic / public interest
  - civic tech
  - govtech
  - public sector
  - public interest
  - social impact
  - nonprofit
  - non-profit
  - public benefit corporation
  - b corp
  - criminal justice
  - humanitarian

management_titles:
  - manager
  - head of
  - director
  - vp
  - vice president
  - lead
  - principal
  - chief
  - founding engineer
  - engineering manager

# Title words that mean a "management_titles" hit is a non-technical
# business function, not a fit for Aviva's technical-leadership background.
# Blocks the management match only - does not affect complex_ic_signals.
excluded_functions:
  - sales
  - account executive
  - accounting
  - controller
  - bookkeeper
  - marketing
  - communications
  - public relations
  - recruiting
  - recruiter
  - talent acquisition
  - human resources
  - legal
  - counsel
  - events
  - field service
  - customer success
  - customer support
  - partnerships
  - business development
  - global
  - finance
  - operations
  - business

